# Local development dependencies only — run Django/Expo on the host.
#   podman compose -f deploy/compose.dev.yaml up -d
name: buku-latihan-dev

services:
  db:
    image: docker.io/postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: buku
      POSTGRES_USER: buku
      POSTGRES_PASSWORD: buku
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: docker.io/redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:

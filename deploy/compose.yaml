# Production stack for a small VPS — Podman or Docker Compose.
#   cp deploy/.env.example deploy/.env   # fill in secrets
#   npx expo export --platform web       # in ../frontend (or web-build service)
#   podman compose -f deploy/compose.yaml up -d --build
name: buku-latihan

services:
  db:
    image: docker.io/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buku}
      POSTGRES_USER: ${POSTGRES_USER:-buku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: docker.io/redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env
    command:
      [
        "sh",
        "-c",
        "python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; socket.create_connection(('localhost', 8000), 5)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env
    command: celery -A config worker -l info --concurrency 2
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping -d celery@$$HOSTNAME",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optional: build the static SPA inside a container instead of locally.
  #   podman compose -f deploy/compose.yaml --profile frontend-build run --rm web-build
  web-build:
    profiles: ["frontend-build"]
    image: docker.io/node:22-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-}
    command: sh -c "npm ci && npx expo export --platform web"

  caddy:
    image: docker.io/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Admin API (localhost:2019) answers only once Caddy has loaded config.
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
